[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vox-mcp-local"
version = "0.1.0"
description = "A resilient, local-only voice runtime for MCP agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ali and Codex" }]
keywords = ["mcp", "voice", "speech", "whisper", "kokoro", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastmcp==3.4.2",
  "mcp==1.28.0",
  "numpy==2.4.6",
  "sounddevice==0.5.5",
  "scipy==1.17.1",
  "httpx==0.28.1",
  "pydub==0.25.1",
  "simpleaudio==1.0.4",
  "webrtcvad-wheels==2.0.14",
  "psutil==7.2.2",
  "click==8.4.2",
  "PyYAML==6.0.3",
  "keyring==25.7.0",
  "openai==2.44.0",
  "websockets==16.0",
  "aiohttp==3.14.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-timeout==2.4.0",
]

[project.scripts]
vox = "voxmcp.cli:main"
vox-mcp = "voxmcp.mcp_server:main"
voxd = "voxmcp.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxmcp"]
include = ["src/voxmcp/**/*.py"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.hatch.build.targets.wheel.force-include]
"dist/Vox.app" = "voxmcp/assets/Vox.app"
"skills/vox" = "voxmcp/assets/skills/vox"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
markers = [
  "integration: uses local processes or loopback services",
  "audio: requires an audio device and microphone permission",
]

[tool.coverage.run]
source = ["voxmcp"]
branch = true
